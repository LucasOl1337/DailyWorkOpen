name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Daily Work app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Daily Work app/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
